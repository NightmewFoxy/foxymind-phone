<!doctype html>
<html lang="zh-CN" class="wait">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>妈妈的小帮手</title>
  <meta name="description" content="帮你整理笔记、做图表的小帮手。">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fbf7f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小帮手">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>html.wait body{background:#fbf7f1}html.wait #app{visibility:hidden}</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:40px 20px;font:20px system-ui,sans-serif">请打开 JavaScript 才能使用这个页面。</p></noscript>
  <script>
  // Always the newest version: version.json is fetched past every cache, and the page loads the files of that
  // version, so a refresh (or reopening the Home Screen icon) picks up an update at once. Bump version.json on publish.
  (function () {
    var BAKED = { v: "8", md: "10" };
    function load(ver) {
      window.MUM_VERSION = ver.v;
      var show = function () { document.documentElement.classList.remove("wait"); };
      var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "app.css?v=" + ver.v; l.onload = l.onerror = show; document.head.appendChild(l);
      setTimeout(show, 3000);
      var a = document.createElement("script"); a.src = "../md.js?v=" + (ver.md || BAKED.md); a.async = false; document.body.appendChild(a);
      var b = document.createElement("script"); b.src = "app.js?v=" + ver.v; b.async = false; document.body.appendChild(b);
    }
    var done = false, go = function (ver) { if (!done) { done = true; load(ver && ver.v ? ver : BAKED); } };
    setTimeout(function () { go(BAKED); }, 4000);
    fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(go, function () { go(BAKED); });
  })();
  </script>
</body>
</html>
